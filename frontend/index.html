<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crowdfunding DApp</title>
</head>
<body>

<h1>Crowdfunding DApp</h1>

<button id="connectBtn">Connect MetaMask</button>

<p>Wallet: <span id="walletAddress">—</span></p>
<p>Network: <span id="networkName">—</span></p>
<p>ETH Balance: <span id="ethBalance">0</span></p>

<hr>

<h2>Create Campaign</h2>
<input id="titleInput" placeholder="Title"><br>
<input id="goalInput" placeholder="Goal ETH"><br>
<input id="dateInput" type="date"><br>
<button id="createBtn">Create</button>

<hr>

<h2>Active Campaigns</h2>
<div id="campaigns"></div>

<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
